<!DOCTYPE html><html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตอบแชทลูกค้า (Admin) - Dorminator</title>
    <link rel="stylesheet" href="../css/style.css?v=1788092300271">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../css/chat_css.css">
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo" style="margin-bottom: 0;">Dorminator Admin</div>
            <div class="sidebar-toggle" onclick="document.querySelector('.sidebar-links').classList.toggle('active')">
                <i class="bx bx-menu"></i>
            </div>
        </div>
        <div class="sidebar-links" style="flex: 1;">
        <a href="dashboard.html"><i class="bx bxs-dashboard"></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html"><i class="bx bx-receipt"></i> จัดการบิล / ตรวจสลิป</a>
        <a href="users.html"><i class="bx bx-user-pin"></i> จัดการผู้เช่า / ห้องพัก</a>
        <a href="maintenance.html"><i class="bx bx-wrench"></i> รายการแจ้งซ่อม</a>
        <a href="chat.html" class="active"><i class="bx bxs-message-dots"></i> ข้อความ (Chat)</a>
        
        <a href="#" class="logout" onclick="logout()"><i class="bx bx-log-out"></i> ออกจากระบบ</a>
    </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper" id="main-wrapper">
        
        <!-- Left: Contact List -->
        <div class="chat-list-container">
            <div class="chat-list-header">
                <h2>กล่องข้อความ</h2>
                <div class="search-box">
                    <i class="bx bx-search"></i>
                    <input type="text" id="search-input" placeholder="ค้นหาห้องพัก หรือ อีเมล...">
                </div>
            </div>
            <div class="chat-list" id="contact-list">
                <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;">กำลังโหลด...</div>
            </div>
        </div>

        <!-- Right: Chat Window -->
        <div class="chat-window">
            
            <!-- Default State (No chat selected) -->
            <div class="empty-chat-state" id="empty-state">
                <i class="bx bx-message-square-dots"></i>
                <h2>ระบบจัดการแชท</h2>
                <p>เลือกผู้เช่าจากแถบด้านซ้ายเพื่อเริ่มสนทนา</p>
            </div>

            <!-- Active Chat Header -->
            <div class="chat-window-header" id="chat-header" style="display: none;">
                <i class="bx bx-arrow-back mobile-back-btn" id="back-to-list"></i>
                <div class="contact-avatar"><i class="bx bx-user"></i></div>
                <div>
                    <h3 id="active-chat-name">ผู้เช่า</h3>
                    <p id="active-chat-email">email@example.com</p>
                </div>
            </div>

            <!-- Active Chat Messages -->
            <div class="chat-messages" id="chat-box" style="display: none;">
                <!-- Messages will be injected here -->
            </div>

            <!-- Input Form -->
            <form class="chat-input-area" id="chat-form" style="display: none;">
                <input type="text" id="msg-input" placeholder="พิมพ์ข้อความตอบกลับ..." autocomplete="off" required="">
                <button type="submit" class="btn-send"><i class="bx bxs-send"></i></button>
            </form>

        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script>
        let contacts = {}; // เก็บข้อมูลคนที่เราคุยด้วย key: email
        let activeChatEmail = null;
        let tenantProfiles = {}; // เก็บข้อมูล { email: { room_no } }

        document.addEventListener("DOMContentLoaded", async () => {
            
            // ================= ADMIN GUARD =================
            const { data: { session: adminSession } } = await supabaseClient.auth.getSession();
            if (!adminSession) {
                window.location.href = "../login.html";
                return;
            }
            const { data: adminProfile } = await supabaseClient.from('tenant_profiles').select('role').eq('email', adminSession.user.email).single();
            if (!adminProfile || adminProfile.role !== 'admin') {
                alert("⛔ ไม่อนุญาตให้เข้าถึง! คุณไม่มีสิทธิ์ผู้ดูแลระบบ");
                window.location.href = "../index.html";
                return;
            }
            // ===============================================


            // ดึงข้อมูลห้องพักของผู้เช่าทุกคนมาเก็บไว้ในหน่วยความจำ
            const { data: profiles } = await supabaseClient.from('tenant_profiles').select('email, room_no');
            if (profiles) {
                profiles.forEach(p => {
                    tenantProfiles[p.email] = p.room_no || 'ไม่ระบุห้อง';
                });
            }

            await loadContacts();

            // Back Button Logic for Mobile
            const backBtn = document.getElementById("back-to-list");
            if (backBtn) {
                backBtn.addEventListener("click", () => {
                    document.getElementById("main-wrapper").classList.remove("chat-active");
                });
            }


            // Polling อัปเดตข้อมูลทุกๆ 3 วินาที
            setInterval(() => {
                loadContacts();
                if (activeChatEmail) {
                    loadActiveChatMessages();
                }
            }, 3000);

            // ระบบค้นหา
            document.getElementById('search-input').addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.contact-item');
                items.forEach(item => {
                    const text = item.innerText.toLowerCase();
                    item.style.display = text.includes(keyword) ? 'flex' : 'none';
                });
            });
        });

        // ดึงรายชื่อผู้ติดต่อ (คนที่เคยแชทกับแอดมิน)
        async function loadContacts() {
            // ดึงแชททั้งหมดที่มีคำว่า 'admin' เกี่ยวข้อง
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .or('sender_email.eq.admin,receiver_email.eq.admin')
                .order('created_at', { ascending: true });

            if (error) return console.error(error);

            let newContacts = {};

            // จัดกลุ่มข้อความตาม Email ของผู้เช่า
            messages.forEach(msg => {
                const tenantEmail = msg.sender_email === 'admin' ? msg.receiver_email : msg.sender_email;
                if (!newContacts[tenantEmail]) {
                    newContacts[tenantEmail] = {
                        email: tenantEmail,
                        lastMsg: msg.message,
                        time: msg.created_at,
                        unreadCount: 0
                    };
                } else {
                    newContacts[tenantEmail].lastMsg = msg.message;
                    newContacts[tenantEmail].time = msg.created_at;
                }

                // นับข้อความที่ยังไม่อ่าน (ส่งจาก tenant หา admin และยังไม่อ่าน)
                if (msg.sender_email === tenantEmail && msg.receiver_email === 'admin' && !msg.is_read) {
                    newContacts[tenantEmail].unreadCount++;
                }
            });

            // สร้าง Array เพื่อนำมาเรียงลำดับคนที่คุยล่าสุดขึ้นบนสุด
            const contactArray = Object.values(newContacts).sort((a, b) => new Date(b.time) - new Date(a.time));
            
            renderContactList(contactArray);
        }

        function renderContactList(contactArray) {
            const listDiv = document.getElementById('contact-list');
            if(contactArray.length === 0) {
                if(!listDiv.innerHTML.includes('ไม่มีประวัติ')) {
                    listDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 14px;">ยังไม่มีประวัติการแชท</div>';
                }
                return;
            }

            let html = '';
            contactArray.forEach(c => {
                let displayName = c.email.split('@')[0];
                let roleBadge = '';
                let isOutsider = !tenantProfiles[c.email];
                
                if (!isOutsider) {
                    const roomNo = tenantProfiles[c.email];
                    roleBadge = `<span class="contact-room" style="background:#3b82f6;">ห้อง ${roomNo}</span>`;
                } else {
                    if (c.email === 'system_booking@mydorm.com') {
                        displayName = "ระบบแจ้งเตือน";
                        roleBadge = `<span class="contact-room" style="background:#f59e0b;">ลูกค้านัดดูห้อง</span>`;
                    } else {
                        roleBadge = `<span class="contact-room" style="background:#8b5cf6;">ผู้ติดต่อภายนอก</span>`;
                    }
                }

                const isActive = activeChatEmail === c.email ? 'active' : '';
                const unreadBadge = c.unreadCount > 0 ? `<span class="unread-badge">${c.unreadCount}</span>` : '';
                
                const d = new Date(c.time);
                const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                html += `
                    <div class="contact-item ${isActive}" onclick="openChat('${c.email}')">
                        <div class="contact-avatar" style="${isOutsider ? 'background:#f59e0b;' : ''}"><i class='bx ${isOutsider ? 'bxs-bell-ring' : 'bx-user'}'></i></div>
                        <div class="contact-info">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <h4 class="contact-name">${displayName} ${roleBadge}</h4>
                                <span style="font-size:10px; color:#94a3b8;">${timeStr}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <p class="contact-msg">${escapeHTML(c.lastMsg)}</p>
                                ${unreadBadge}
                            </div>
                        </div>
                    </div>
                `;
            });

            // ตรวจสอบว่า HTML เปลี่ยนไปไหม เพื่อลดการกระตุกของการ render
            if(listDiv.innerHTML !== html) {
                listDiv.innerHTML = html;
            }
        }

        async function openChat(tenantEmail) {
            document.getElementById("main-wrapper").classList.add("chat-active");
            activeChatEmail = tenantEmail;
            
            let chatTitle = "";
            let isOutsider = !tenantProfiles[tenantEmail];
            
            if (!isOutsider) {
                chatTitle = `ผู้เช่าห้อง ${tenantProfiles[tenantEmail]}`;
                document.getElementById('chat-form').style.display = 'flex';
            } else {
                if (tenantEmail === 'system_booking@mydorm.com') {
                    chatTitle = `ลูกค้านัดดูห้อง (ระบบอัตโนมัติ)`;
                    // ซ่อนช่องพิมพ์แชท เพราะเป็นข้อความจากระบบลูกค้าทั่วไป (พิมพ์ตอบไปเขาก็ไม่เห็น)
                    document.getElementById('chat-form').style.display = 'none';
                } else {
                    chatTitle = `ผู้ติดต่อภายนอก`;
                    document.getElementById('chat-form').style.display = 'flex';
                }
            }

            // สลับ UI
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat-box').style.display = 'flex';

            document.getElementById('active-chat-name').innerText = chatTitle;
            document.getElementById('active-chat-email').innerText = tenantEmail;

            // เน้นสีคนที่ถูกเลือก
            const items = document.querySelectorAll('.contact-item');
            items.forEach(item => item.classList.remove('active'));
            // อันที่จริงโหลดรอบหน้ามันจะ active เอง แต่ทำหลอกตาไว้ก่อนให้เนียน
            
            // เปลี่ยนสถานะข้อความว่า "อ่านแล้ว" (is_read = true)
            await supabaseClient
                .from('messages')
                .update({ is_read: true })
                .eq('sender_email', tenantEmail)
                .eq('receiver_email', 'admin')
                .eq('is_read', false);

            await loadActiveChatMessages(true);
            loadContacts(); // รีเฟรช Contact List เผื่อลบ Unread Badge
        }

        let lastMessageCount = 0;
        
        async function loadActiveChatMessages(forceScroll = false) {
            if (!activeChatEmail) return;

            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .or(`and(sender_email.eq.admin,receiver_email.eq.${activeChatEmail}),and(sender_email.eq.${activeChatEmail},receiver_email.eq.admin)`)
                .order('created_at', { ascending: true });

            if (error) return;

            if (messages.length !== lastMessageCount || forceScroll) {
                lastMessageCount = messages.length;
                renderMessages(messages, forceScroll);
            }
        }

        function renderMessages(messages, forceScroll) {
            const chatBox = document.getElementById('chat-box');
            let html = '';

            messages.forEach(msg => {
                const isAdmin = msg.sender_email === 'admin';
                const d = new Date(msg.created_at);
                const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                html += `
                    <div class="msg-row ${isAdmin ? 'admin' : 'tenant'}" style="position: relative;">
                        ${!isAdmin ? `<button onclick="deleteMessage('${msg.id}')" title="ลบข้อความนี้" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer; align-self:center; margin-right:8px;"><i class='bx bx-trash'></i></button>` : ''}
                        
                        <div class="msg-bubble">
                            ${escapeHTML(msg.message)}
                            <span class="msg-time">${timeStr}</span>
                        </div>
                        
                        ${isAdmin ? `<button onclick="deleteMessage('${msg.id}')" title="ลบข้อความนี้" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer; align-self:center; margin-left:8px;"><i class='bx bx-trash'></i></button>` : ''}
                    </div>
                `;
            });

            chatBox.innerHTML = html;

            if (forceScroll) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function deleteMessage(msgId) {
            if(confirm("แน่ใจหรือไม่ว่าต้องการลบข้อความนี้? (ผู้เช่าก็จะมองไม่เห็นเช่นกัน)")) {
                const { error } = await supabaseClient.from('messages').delete().eq('id', msgId);
                if(!error) {
                    loadActiveChatMessages(true);
                }
            }
        }

        // ฟังก์ชันส่งข้อความ
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activeChatEmail) return;

            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = ''; // เคลียร์ช่องพิมพ์

            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    sender_email: 'admin',
                    receiver_email: activeChatEmail,
                    message: text,
                    is_read: false
                }]);

            if (!error) {
                loadActiveChatMessages(true);
                loadContacts();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        async function logout() {
            // --- Rubric 9: Clear Cookie & Session ---
            document.cookie = "rememberMe=; max-age=0; path=/;";
            sessionStorage.clear();
            // ----------------------------------------
            await supabaseClient.auth.signOut();
            window.location.href = "../login.html";
        }
    </script>


</body></html>
