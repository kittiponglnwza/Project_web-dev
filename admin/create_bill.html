<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบิลค่าเช่ารายเดือน - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --text: #334155;
        }
        body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; background: var(--bg); display: flex; color: var(--text); }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #fff; height: 100vh; padding: 30px 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; box-sizing: border-box; z-index: 100;}
        .sidebar .logo { font-size: 24px; font-weight: 600; color: var(--primary); margin-bottom: 40px; text-align: center; letter-spacing: 1px; }
        .sidebar a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #64748b; padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); color: #fff; }
        .sidebar a.logout { color: #ef4444; margin-top: auto; position: absolute; bottom: 30px; width: calc(100% - 40px); }
        .sidebar a.logout:hover { background: #fee2e2; color: #dc2626; }

        /* Main Content */
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); box-sizing: border-box; height: 100vh; overflow-y: auto; }
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-actions h2 { margin: 0; color: #0f172a; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        
        .btn-secondary { background: #e2e8f0; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Prompt'; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-secondary:hover { background: #cbd5e1; color: #0f172a; }

        /* Form Card */
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); padding: 40px; max-width: 1100px; margin: 0 auto; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #64748b; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Prompt'; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { padding: 12px; text-align: left; background: #f8fafc; border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 14px; font-weight: 500; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .room-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; color: #fff; }
        .type-S { background: #10b981; } /* 🟢 */
        .type-M { background: #3b82f6; } /* 🔵 */
        .type-XL { background: #a855f7; } /* 🟣 */

        .input-sm { width: 80px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Prompt'; font-size: 14px; outline: none; text-align: center; }
        .input-sm:focus { border-color: #3b82f6; }
        .total-col { font-weight: 600; color: #dc2626; font-size: 16px; }

        .btn-submit { width: 100%; background: #0f172a; color: #fff; border: none; padding: 15px; border-radius: 12px; font-family: 'Prompt'; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-submit:hover { background: #1e293b; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(15, 23, 42, 0.2); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">K. DORM ADMIN</div>
        <a href="dashboard.html"><i class='bx bxs-dashboard'></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html" class="active"><i class='bx bx-receipt'></i> จัดการบิล / ตรวจสลิป</a>
        <a href="users.html"><i class='bx bx-user-pin'></i> จัดการผู้เช่า / ห้องพัก</a>
        <a href="maintenance.html"><i class='bx bx-wrench'></i> รายการแจ้งซ่อม</a>
        <a href="chat.html"><i class='bx bxs-message-dots'></i> ข้อความ (Chat)</a>
        
        <a href="#" class="logout" onclick="logout()"><i class='bx bx-log-out'></i> ออกจากระบบ</a>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <h2><i class='bx bx-plus-circle'></i> บันทึกบิลค่าเช่ารายเดือน</h2>
            <a href="billing.html" class="btn-secondary"><i class='bx bx-arrow-back'></i> กลับไปหน้ารวมบิล</a>
        </div>

        <div class="card">
            <div class="form-group" style="max-width: 300px;">
                <label>ประจำเดือน (เช่น ตุลาคม 2567)</label>
                <input type="text" id="b_month" required placeholder="ต.ค. 2567">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ห้องพัก</th>
                        <th>ผู้เช่า</th>
                        <th>ค่าห้อง (฿)</th>
                        <th>หน่วยไฟ (x8)</th>
                        <th>หน่วยน้ำ (x18)</th>
                        <th>ค่าอื่นๆ (฿)</th>
                        <th>ยอดรวม (฿)</th>
                    </tr>
                </thead>
                <tbody id="rooms-table-body">
                    <tr><td colspan="7" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>

            <button type="button" class="btn-submit" id="save-all-btn" onclick="saveAllBills()"><i class='bx bx-save'></i> บันทึกบิลทั้งหมด (16 ห้อง)</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        let tenantProfiles = [];
        
        // กำหนดข้อมูลโครงสร้างห้องชั้น 1 (16 ห้อง)
        const dormRooms = [
            { no: '101', type: 'S', price: 5500 },
            { no: '102', type: 'S', price: 5500 },
            { no: '103', type: 'S', price: 5500 },
            { no: '104', type: 'S', price: 5500 },
            { no: '105', type: 'M', price: 7500 },
            { no: '106', type: 'M', price: 7500 },
            { no: '107', type: 'M', price: 7500 },
            { no: '108', type: 'M', price: 7500 },
            { no: '109', type: 'M', price: 7500 },
            { no: '110', type: 'M', price: 7500 },
            { no: '111', type: 'XL', price: 9000 },
            { no: '112', type: 'XL', price: 9000 },
            { no: '113', type: 'XL', price: 9000 },
            { no: '114', type: 'XL', price: 9000 },
            { no: '115', type: 'XL', price: 9000 },
            { no: '116', type: 'XL', price: 9000 }
        ];

        document.addEventListener("DOMContentLoaded", async () => {
            // เซ็ตเดือนปัจจุบันอัตโนมัติ
            const thaiMonths = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
            const d = new Date();
            document.getElementById('b_month').value = `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
            
            await loadTenants();
            renderTable();
        });

        async function loadTenants() {
            const { data } = await supabaseClient.from('tenant_profiles').select('*').neq('role', 'admin');
            if(data) {
                tenantProfiles = data;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('rooms-table-body');
            tbody.innerHTML = '';

            dormRooms.forEach((r, index) => {
                // ค้นหาผู้เช่าที่อยู่ห้องนี้
                const tenant = tenantProfiles.find(t => t.room_no === r.no);
                const tenantName = tenant ? tenant.email : '<span style="color:#94a3b8; font-size:12px;">ว่าง</span>';
                
                // กำหนดสีป้าย Type
                const badgeClass = `type-${r.type}`;

                tbody.innerHTML += `
                    <tr id="row-${r.no}" data-room="${r.no}" data-email="${tenant ? tenant.email : ''}">
                        <td>
                            <span class="room-badge ${badgeClass}">${r.type}</span> 
                            <strong style="margin-left:8px; color:#0f172a;">${r.no}</strong>
                        </td>
                        <td style="font-size:13px; max-width:150px; overflow:hidden; text-overflow:ellipsis;">${tenantName}</td>
                        <td>${r.price.toLocaleString()}</td>
                        <td><input type="number" class="input-sm calc-input" id="elec-${r.no}" value="0" min="0" oninput="calculateRow('${r.no}', ${r.price})"></td>
                        <td><input type="number" class="input-sm calc-input" id="water-${r.no}" value="0" min="0" oninput="calculateRow('${r.no}', ${r.price})"></td>
                        <td><input type="number" class="input-sm calc-input" id="other-${r.no}" value="0" min="0" oninput="calculateRow('${r.no}', ${r.price})"></td>
                        <td class="total-col" id="total-${r.no}">${r.price.toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        function calculateRow(roomNo, basePrice) {
            const elecUnit = parseInt(document.getElementById(`elec-${roomNo}`).value) || 0;
            const waterUnit = parseInt(document.getElementById(`water-${roomNo}`).value) || 0;
            const otherFee = parseInt(document.getElementById(`other-${roomNo}`).value) || 0;

            const total = basePrice + (elecUnit * 8) + (waterUnit * 18) + otherFee;
            document.getElementById(`total-${roomNo}`).innerText = total.toLocaleString();
        }

        async function saveAllBills() {
            const month = document.getElementById('b_month').value;
            if(!month) {
                alert("กรุณาระบุประจำเดือน");
                return;
            }

            if(!confirm(`ยืนยันการสร้างบิลสำหรับเดือน "${month}" จำนวน 16 ห้อง?`)) return;

            const btn = document.getElementById('save-all-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> กำลังบันทึกข้อมูล...`;

            const billsToInsert = [];

            dormRooms.forEach(r => {
                const row = document.getElementById(`row-${r.no}`);
                const email = row.getAttribute('data-email');
                
                // ถ้าไม่มีผู้เช่า เราอาจจะบันทึกอีเมลเป็น null หรือ '-' แต่ใน Supabase อาจจะเกิดปัญหา foreign key 
                // หรือเราจะบันทึกแค่ห้องที่มีคนอยู่ก็ได้ แต่โจทย์คือ "บันทึกรายเดือน 16 ห้อง"
                // จะลองกำหนดเป็น empty string ไปก่อนถ้าไม่มี
                const finalEmail = email || '-'; 

                const elecUnit = parseInt(document.getElementById(`elec-${r.no}`).value) || 0;
                const waterUnit = parseInt(document.getElementById(`water-${r.no}`).value) || 0;
                const otherFee = parseInt(document.getElementById(`other-${r.no}`).value) || 0;
                
                const elecFee = elecUnit * 8;
                const waterFee = waterUnit * 18;
                const totalAmount = r.price + elecFee + waterFee + otherFee;

                billsToInsert.push({
                    email: finalEmail,
                    room_no: r.no,
                    month: month,
                    rent_fee: r.price,
                    other_fee: otherFee,
                    elec_unit: elecUnit,
                    elec_fee: elecFee,
                    water_unit: waterUnit,
                    water_fee: waterFee,
                    amount: totalAmount,
                    status: 'pending' // รอลูกบ้านชำระ
                });
            });

            // บันทึกเข้า Supabase ทีเดียวทั้งหมด (Bulk Insert)
            const { data, error } = await supabaseClient.from('bills').insert(billsToInsert);

            if (error) {
                alert('เกิดข้อผิดพลาดในการสร้างบิล: ' + error.message);
                console.error(error);
                btn.disabled = false;
                btn.innerHTML = `<i class='bx bx-save'></i> บันทึกบิลทั้งหมด (16 ห้อง)`;
            } else {
                alert('สร้างบิลรายเดือนสำเร็จ 16 ห้องรวด!');
                window.location.href = 'billing.html';
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "../login.html";
        }
    </script>
</body>
</html>
