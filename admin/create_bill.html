<!DOCTYPE html><html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบิลค่าเช่ารายเดือน - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=1.2.0" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=1.2.1">
    <link rel="stylesheet" href="../css/admin/create_bill.css?v=1.3.0">
</head>
<body class="admin-layout">

    <nav class="sidebar" id="app-sidebar"></nav>

    <main class="main-content">
        <header class="header-actions">
            <h2><i class="bx bx-plus-circle"></i> บันทึกบิลค่าเช่ารายเดือน</h2>
            <a href="billing.html" class="btn-secondary"><i class="bx bx-arrow-back"></i> กลับไปหน้ารวมบิล</a>
        </header>

        <!-- Promotion Banner -->
        <div id="promo-banner" class="promo-banner" style="display:none;"></div>

        <div class="card">
            <div class="form-group" style="max-width: 300px;">
                <label>ประจำเดือน</label>
                <select id="b_month" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: 'Prompt'; font-size: 1rem;">
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ห้องพัก</th>
                        <th>ผู้เช่า</th>
                        <th>ค่าห้อง (฿)</th>
                        <th>หน่วยไฟ (x8)</th>
                        <th>หน่วยน้ำ (x18)</th>
                        <th>ค่าอื่นๆ (฿)</th>
                        <th>ส่วนลด (฿)</th>
                        <th>ยอดรวม (฿)</th>
                    </tr>
                </thead>
                <tbody id="rooms-table-body">
                    <tr><td colspan="8" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>

            <button type="button" class="btn-submit" id="save-all-btn" onclick="saveAllBills()"><i class="bx bx-save"></i> บันทึกบิลทั้งหมด (16 ห้อง)</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js?v=1.2.0"></script>
    <script src="../js/shared/utils.js"></script>
    <script src="../js/shared/auth-guard.js"></script>
    <script src="../js/shared/components.js"></script>
    <script src="../js/admin/create-bill.js"></script>
</body>
</html>
