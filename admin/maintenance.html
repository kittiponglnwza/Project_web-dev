<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการแจ้งซ่อม (Admin) - K. Dormitory</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8fafc; margin: 0; font-family: 'Prompt', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #0f172a; color: #fff; height: 100vh; padding: 20px 0; position: fixed; display: flex; flex-direction: column; z-index: 10; }
        .sidebar .logo { font-size: 24px; font-weight: 600; text-align: center; color: #facc15; margin-bottom: 30px; letter-spacing: 1px; }
        .sidebar a { display: flex; align-items: center; padding: 15px 25px; color: #cbd5e1; text-decoration: none; font-size: 15px; transition: 0.3s; }
        .sidebar a i { font-size: 20px; margin-right: 15px; }
        .sidebar a:hover, .sidebar a.active { background: #1e293b; color: #fff; border-left: 4px solid #facc15; }
        .sidebar .logout { margin-top: auto; border-top: 1px solid #1e293b; color: #f87171; }

        .main-content { margin-left: 260px; padding: 30px 40px; width: calc(100% - 260px); overflow-y: auto; box-sizing: border-box; }
        .header-actions { margin-bottom: 30px; }
        .header-actions h2 { margin: 0; color: #0f172a; font-size: 24px; }
        
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }
        
        .filter-bar { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .filter-btn { background: #fff; border: 1px solid #cbd5e1; padding: 6px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; color: #64748b; transition: 0.2s; }
        .filter-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px 20px; background: #fff; color: #64748b; font-size: 13px; font-weight: 500; border-bottom: 2px solid #f1f5f9; }
        td { padding: 15px 20px; color: #334155; font-size: 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .st-pending { background: #fef08a; color: #854d0e; }
        .st-completed { background: #d1fae5; color: #059669; }

        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-family: 'Prompt'; font-size: 13px; transition: 0.2s; }
        .btn-complete { background: #10b981; color: #fff; }
        .btn-complete:hover { background: #059669; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">K. DORM ADMIN</div>
        <a href="dashboard.html"><i class='bx bxs-dashboard'></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html"><i class='bx bx-receipt'></i> จัดการบิล / ตรวจสลิป</a>
        <a href="users.html"><i class='bx bx-user-pin'></i> จัดการผู้เช่า / ห้องพัก</a>
        <a href="maintenance.html" class="active"><i class='bx bx-wrench'></i> รายการแจ้งซ่อม</a>
        <a href="chat.html"><i class='bx bxs-message-dots'></i> ข้อความ (Chat)</a>
        
        <a href="#" class="logout" onclick="logout()"><i class='bx bx-log-out'></i> ออกจากระบบ</a>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <h2>รายการแจ้งซ่อม / ปัญหา (Maintenance Requests)</h2>
        </div>

        <div class="card">
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filterData('all', this)">ทั้งหมด</button>
                <button class="filter-btn" onclick="filterData('pending', this)">รอดำเนินการ 🔴</button>
                <button class="filter-btn" onclick="filterData('completed', this)">ซ่อมเสร็จแล้ว 🟢</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">วันที่แจ้ง</th>
                        <th style="width: 10%;">ห้องพัก</th>
                        <th style="width: 25%;">หัวข้อปัญหา</th>
                        <th style="width: 30%;">รายละเอียด</th>
                        <th style="width: 10%;">สถานะ</th>
                        <th style="width: 10%; text-align: center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="maintenance-table-body">
                    <tr><td colspan="6" style="text-align: center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script>
        let allRequests = [];
        let tenantProfiles = {};

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "../login.html";
                return;
            }
            await loadProfiles();
            await loadRequests();
        });

        async function loadProfiles() {
            const { data } = await supabaseClient.from('tenant_profiles').select('email, room_no');
            if(data) {
                data.forEach(p => {
                    tenantProfiles[p.email] = p.room_no || '-';
                });
            }
        }

        async function loadRequests() {
            const { data, error } = await supabaseClient
                .from('maintenance_requests')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error && data) {
                allRequests = data;
                renderTable(data);
            }
        }

        function filterData(status, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if(status === 'all') renderTable(allRequests);
            else renderTable(allRequests.filter(r => r.status === status));
        }

        function renderTable(requests) {
            const tbody = document.getElementById('maintenance-table-body');
            tbody.innerHTML = '';

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">ไม่มีรายการแจ้งซ่อม</td></tr>';
                return;
            }

            requests.forEach(req => {
                const roomNo = tenantProfiles[req.email] || 'ไม่ทราบห้อง';
                const d = new Date(req.created_at);
                const dateStr = d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
                
                let badge = '';
                let actionBtn = '';

                if (req.status === 'completed') {
                    badge = '<span class="status-badge st-completed"><i class="bx bx-check"></i> ซ่อมเสร็จแล้ว</span>';
                    actionBtn = `<span style="color:#94a3b8; font-size:12px;">เรียบร้อย</span>`;
                } else {
                    badge = '<span class="status-badge st-pending"><i class="bx bx-time"></i> รอดำเนินการ</span>';
                    actionBtn = `<button class="btn-action btn-complete" onclick="markCompleted(${req.id})">กดเมื่อซ่อมเสร็จ</button>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="font-size: 12px; color: #64748b;">${dateStr}</td>
                        <td style="font-weight: 600; color: #0f172a;">${roomNo}</td>
                        <td style="font-weight: 500;">${req.title}</td>
                        <td style="font-size: 13px; color: #64748b;">${req.description || '-'}</td>
                        <td>${badge}</td>
                        <td style="text-align: center;">${actionBtn}</td>
                    </tr>
                `;
            });
        }

        async function markCompleted(id) {
            if(confirm('ยืนยันว่าช่างได้เข้าซ่อมแซมปัญหานี้เสร็จสิ้นแล้วใช่หรือไม่?')) {
                const { error } = await supabaseClient
                    .from('maintenance_requests')
                    .update({ status: 'completed' })
                    .eq('id', id);
                
                if(!error) {
                    alert('อัปเดตสถานะสำเร็จ!');
                    loadRequests(); // รีเฟรช
                }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "../login.html";
        }
    </script>
</body>
</html>
