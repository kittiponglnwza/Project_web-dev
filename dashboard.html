<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผงควบคุมผู้เช่า - MyDorm</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f3f4f6; margin: 0; font-family: 'Prompt', sans-serif; display: flex; color: #374151; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #fff; height: 100vh; padding: 25px 0; box-shadow: 2px 0 15px rgba(0,0,0,0.03); position: fixed; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-logo { text-align: center; font-size: 1.8rem; font-weight: 600; color: #d4af37; margin-bottom: 40px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(212, 175, 55, 0.2); }
        
        .nav-menu { flex: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 15px 30px; color: #6b7280; text-decoration: none; font-size: 1rem; transition: 0.3s; border-left: 4px solid transparent; cursor: pointer; }
        .nav-link:hover { background: #f9fafb; color: #d4af37; }
        .nav-link.active { background: #faf5e5; color: #d4af37; border-left: 4px solid #d4af37; font-weight: 500; }
        .nav-link i { font-size: 1.4rem; }
        
        .logout-btn { color: #ef4444; border-top: 1px solid #f3f4f6; margin-top: auto; padding-top: 20px; }
        .logout-btn:hover { background: #fef2f2; color: #dc2626; border-left-color: #dc2626; }
        
        /* Main Content */
        .main-content { margin-left: 260px; padding: 40px 50px; width: calc(100% - 260px); min-height: 100vh; }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: #fff; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 500; }
        .user-avatar { width: 45px; height: 45px; background: #d4af37; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
        
        /* Sections */
        .content-section { display: none; animation: fadeIn 0.3s; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards */
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.3s; border: 1px solid #f3f4f6; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-icon { width: 55px; height: 55px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 20px; }
        .card-title { color: #6b7280; font-size: 0.95rem; margin-bottom: 8px; font-weight: 400; }
        .card-value { font-size: 1.8rem; font-weight: 600; color: #111; }
        
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .section-box { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f3f4f6; }
        .section-header { border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; margin-bottom: 25px; font-size: 1.2rem; font-weight: 600; color: #111; display: flex; justify-content: space-between; align-items: center; }
        
        .news-item { padding: 15px 20px; border-left: 4px solid #d4af37; background: #faf5e5; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
        
        .btn-home { background: #111; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .btn-home:hover { background: #d4af37; }

        /* Tables & Forms */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .data-table th { color: #6b7280; font-weight: 500; font-size: 0.9rem; }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-paid { background: #d1fae5; color: #059669; }
        
        .lux-input { width: 100%; padding: 12px 15px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Prompt'; margin-bottom: 15px; }
        .lux-btn { background: #111; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-family: 'Prompt'; cursor: pointer; transition: 0.3s; }
        .lux-btn:hover { background: #d4af37; }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">MyDorm</div>
        
        <div class="nav-menu">
            <a onclick="switchTab('dashboard')" class="nav-link active" id="tab-dashboard"><i class='bx bxs-dashboard'></i> ภาพรวม</a>
            <a onclick="switchTab('billing')" class="nav-link" id="tab-billing"><i class='bx bx-receipt'></i> บิลค่าเช่า</a>
            <a onclick="switchTab('maintenance')" class="nav-link" id="tab-maintenance"><i class='bx bx-wrench'></i> แจ้งซ่อม/ปัญหา</a>
            <a onclick="switchTab('profile')" class="nav-link" id="tab-profile"><i class='bx bx-user'></i> ข้อมูลส่วนตัว</a>
        </div>
        
        <a href="#" class="nav-link logout-btn" onclick="logout()"><i class='bx bx-log-out'></i> ออกจากระบบ</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Header กลางสำหรับทุกหน้า -->
        <div class="top-header">
            <div>
                <h1 style="font-size: 1.6rem; margin: 0; color: #111;">พอร์ทัลผู้เช่า (Tenant Portal)</h1>
                <p style="color: #6b7280; margin: 5px 0 0 0; font-size: 0.95rem;" id="welcome-text">กำลังโหลดข้อมูล...</p>
            </div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="index.html" class="btn-home"><i class='bx bx-home'></i> กลับหน้าแรก</a>
                <div class="user-profile">
                    <div class="user-avatar"><i class='bx bx-user'></i></div>
                    <span id="profile-name">-</span>
                </div>
            </div>
        </div>

        <!-- 1. ภาพรวม (Dashboard) -->
        <div id="view-dashboard" class="content-section active">
            <div class="dashboard-cards">
                <div class="card">
                    <div class="card-icon" style="background: #fef3c7; color: #d97706;"><i class='bx bx-wallet'></i></div>
                    <div class="card-title">ยอดค้างชำระ (บาท)</div>
                    <div class="card-value" id="dash-bill">0</div>
                </div>
                <div class="card">
                    <div class="card-icon" style="background: #d1fae5; color: #059669;"><i class='bx bx-wrench'></i></div>
                    <div class="card-title">สถานะแจ้งซ่อม</div>
                    <div class="card-value" id="dash-maintenance" style="font-size: 1.4rem; color: #059669;">ปกติ</div>
                </div>
                <div class="card">
                    <div class="card-icon" style="background: #e0e7ff; color: #4f46e5;"><i class='bx bx-building-house'></i></div>
                    <div class="card-title">ข้อมูลสัญญาเช่า</div>
                    <div class="card-value" style="font-size: 1.4rem;">ห้อง 302 (Deluxe)</div>
                </div>
            </div>
            <div class="section-box">
                <div class="section-header">📢 ข่าวประชาสัมพันธ์ล่าสุด</div>
                <div class="news-item">
            </div>

            <!-- Quick Actions -->
            <div class="section-box">
                <div class="section-header">⚡ เมนูด่วน</div>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <button style="width: 100%; padding: 15px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px; font-family: 'Prompt'; font-size: 1rem; transition: 0.2s;" onmouseover="this.style.borderColor='#d4af37'; this.style.color='#d4af37'" onmouseout="this.style.borderColor='#e5e7eb'; this.style.color='#374151'">
                        <div style="background: #f3f4f6; padding: 10px; border-radius: 8px; color: #4b5563;"><i class='bx bx-qr-scan' style="font-size: 1.2rem;"></i></div>
                        สแกนจ่ายค่าหอพัก
                    </button>
                    <button style="width: 100%; padding: 15px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px; font-family: 'Prompt'; font-size: 1rem; transition: 0.2s;" onmouseover="this.style.borderColor='#ef4444'; this.style.color='#ef4444'" onmouseout="this.style.borderColor='#e5e7eb'; this.style.color='#374151'">
                        <div style="background: #f3f4f6; padding: 10px; border-radius: 8px; color: #4b5563;"><i class='bx bx-wrench' style="font-size: 1.2rem;"></i></div>
                        แจ้งซ่อมฉุกเฉิน
                    </button>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // โค้ดดึงข้อมูล User มาแสดงใน Dashboard
        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // ถ้าไม่มี Session (แอบเข้าหน้านี้โดยไม่ล็อกอิน) ให้ดีดกลับไปหน้า Login
            if (!session) {
                window.location.href = "login.html";
                return;
            }
            
            const user = session.user;
            let fullName = user.email;
            
            // ดึงชื่อจาก user_metadata ที่เราเก็บไว้ตอนสมัคร
            if (user.user_metadata && user.user_metadata.full_name) {
                const title = user.user_metadata.title || "";
                fullName = title + user.user_metadata.full_name;
            }
            
            document.getElementById("welcome-text").innerText = "สวัสดี, " + fullName;
            document.getElementById("profile-name").innerText = fullName.split(' ')[0]; // เอาแค่ชื่อแรก
        });
    </script>
</body>
</html>
