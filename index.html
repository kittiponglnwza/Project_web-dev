<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDorm - ระบบจัดการหอพัก</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">MyDorm</div>
        
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="#rooms">ดูห้องว่าง</a></li>
                <li><a href="login.html" class="btn-login">เข้าสู่ระบบ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section แบบใหม่ ใส่รูปตึกเป็น Background -->
        <section class="hero">
            <div class="hero-content">
                <h1>ยินดีต้อนรับสู่ MyDorm</h1>
                <p>หอพักที่ตอบโจทย์ทุกไลฟ์สไตล์ สะดวก ปลอดภัย ใกล้มหาวิทยาลัย</p>
            </div>
        </section>

        <section id="rooms" class="room-section">
            <h2>อัปเดตสถานะห้องพักล่าสุด</h2>
            <p>ข้อมูลอัปเดตแบบเรียลไทม์ เลื่อนดูรูปภาพภายในห้องได้เลย</p>
            
            <!-- เปลี่ยนจาก grid-container เป็น list-container -->
            <div id="room-container" class="list-container">
                <p class="loading-text">กำลังโหลดข้อมูลห้องพัก...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 MyDorm System. โปรเจกต์วิชา Web Development.</p>
    </footer>

    <!-- นำเข้าไอคอน BoxIcons สำหรับปุ่ม Login -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script> <!-- เพิ่มสคริปต์จัดการ Session/Login -->
</body>
</html>
