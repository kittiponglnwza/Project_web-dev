<!DOCTYPE html><html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผงควบคุมผู้เช่า - Dorminator</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2.2">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=1.2.0" rel="stylesheet">
    <link rel="stylesheet" href="../css/tenant/dashboard.css?v=1.2.0">
</head>
<body class="tenant-layout">

    <!-- Sidebar -->
    <nav class="sidebar" id="app-sidebar"></nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div>
                <h1 class="page-title" style="margin: 0;">ยินดีต้อนรับสู่ระบบจัดการผู้เช่า</h1>
                <p style="color: #6b7280; margin-top: 5px;" id="welcome-text">กำลังโหลดข้อมูล...</p>
            </div>
            <div style="display: flex; align-items: center;">

                <div class="user-profile">
                    <div style="width: 40px; height: 40px; background: #d4af37; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="bx bx-user"></i>
                    </div>
                    <span id="profile-name">ผู้เช่า</span>
                </div>
            </div>
        </header>

        <!-- Dashboard Cards -->
        <section class="dashboard-cards">
            <div class="card">
                <div class="card-icon" style="background: #fef3c7; color: #d97706;"><i class="bx bx-wallet"></i></div>
                <div class="card-title">ยอดค้างชำระเดือนนี้</div>
                <div class="card-value" id="card-due">-</div>
            </div>
            <div class="card">
                <div class="card-icon" style="background: #d1fae5; color: #059669;"><i class="bx bx-wrench"></i></div>
                <div class="card-title">สถานะแจ้งซ่อมล่าสุด</div>
                <div class="card-value" id="card-maintenance" style="font-size: 1.4rem;">-</div>
            </div>
            <div class="card">
                <div class="card-icon" style="background: #e0e7ff; color: #4f46e5;"><i class="bx bx-building-house"></i></div>
                <div class="card-title">ห้องพักของคุณ</div>
                <div class="card-value" id="card-room" style="font-size: 1.4rem;">-</div>
            </div>
            <div class="card">
                <div class="card-icon" style="background: #fce7f3; color: #be185d;"><i class="bx bx-check-shield"></i></div>
                <div class="card-title">ชำระแล้วสำหรับห้องนี้</div>
                <div class="card-value" id="card-room-paid">-</div>
            </div>
        </section>

        <section class="recent-section" aria-label="ข่าวประชาสัมพันธ์">
            <div class="section-header">ข่าวประชาสัมพันธ์ล่าสุด</div>
            <div id="tenant-announcements">
                <div style="text-align: center; color: #9ca3af; padding: 20px;">กำลังโหลดประกาศ...</div>
            </div>
        </section>

        <footer class="app-footer">
            <p class="session-info" id="session-info"></p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js?v=1.2.0"></script>
    <script src="../js/shared/utils.js?v=1.3.3"></script>
    <script src="../js/shared/session.js?v=1.3.0"></script>
    <script src="../js/auth.js?v=1.3.0"></script>
    <script src="../js/shared/auth-guard.js?v=1.3.0"></script>
    <script src="../js/shared/components.js"></script>
    <script src="../js/tenant/dashboard.js?v=1.3.0"></script>


</body></html>
