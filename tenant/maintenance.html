<!DOCTYPE html><html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งซ่อม - Dorminator</title>
    <link rel="stylesheet" href="../css/style.css?v=1.1.0">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=1.1.0" rel="stylesheet">
    <link rel="stylesheet" href="../css/tenant/maintenance.css?v=1.1.0">
</head>
<body class="tenant-layout">

    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo" style="margin-bottom: 0;">Dorminator</div>
            <div class="sidebar-toggle">
                <i class="bx bx-menu"></i>
            </div>
        </div>
        <div class="sidebar-links" style="flex: 1;">
        <a href="dashboard.html" class="nav-link"><i class="bx bx-grid-alt"></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html" class="nav-link"><i class="bx bx-receipt"></i> รายการค้างชำระ</a>
        <a href="maintenance.html" class="nav-link active"><i class="bx bx-wrench"></i> แจ้งซ่อม/ปัญหา</a>
        <a href="profile.html" class="nav-link"><i class="bx bx-user"></i> ข้อมูลส่วนตัว</a>
        <a href="chat.html" class="nav-link"><i class="bx bx-message-square-dots"></i> ติดต่อนิติบุคคล</a>
        <a href="#" class="nav-link logout-btn" onclick="logout()"><i class="bx bx-log-out"></i> ออกจากระบบ</a>
    </div>
    </nav>

    <main class="main-content dash-layout">
        <!-- ฝั่งซ้าย ประวัติ -->
        <div>
            <h1 style="font-size: 1.8rem; margin: 0 0 30px 0; color: #111;">แจ้งซ่อมและปัญหาต่างๆ</h1>
            <div class="recent-section">
                <div class="section-header">ประวัติการแจ้งซ่อม</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>เรื่อง</th>
                            <th>วันที่แจ้ง</th>
                            <th>สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="maintenance-list">
                        <tr>
                            <td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ฝั่งขวา ฟอร์ม -->
        <div>
            <h1 class="desktop-spacer">-</h1>
            <div class="recent-section">
                <div class="section-header">แบบฟอร์มแจ้งซ่อมใหม่</div>
                <form id="maintenanceForm">
                    <input type="text" id="m_title" class="lux-input" placeholder="เรื่องที่ต้องการแจ้ง (เช่น ก๊อกน้ำรั่ว)" required="">
                    <textarea id="m_desc" class="lux-input" placeholder="รายละเอียดเพิ่มเติม" rows="4" required=""></textarea>
                    <button type="submit" class="submit-btn" id="submitBtn">ส่งเรื่องแจ้งซ่อม <i class="bx bx-send"></i></button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js?v=2"></script>
    <script src="../js/shared/utils.js"></script>
    <script src="../js/shared/auth-guard.js"></script>
    <script src="../js/tenant/maintenance.js"></script>
</body></html>
