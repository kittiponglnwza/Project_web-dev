<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งซ่อม - MyDorm</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body { background-color: #f3f4f6; margin: 0; font-family: 'Prompt', sans-serif; display: flex; }
        .sidebar { width: 260px; background: #fff; height: 100vh; padding: 20px 0; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; display: flex; flex-direction: column; }
        .sidebar-logo { text-align: center; font-size: 1.8rem; font-weight: 600; color: #d4af37; margin-bottom: 30px; letter-spacing: 1px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 15px 25px; color: #4b5563; text-decoration: none; font-size: 1rem; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #f9fafb; color: #d4af37; border-right: 4px solid #d4af37; }
        .nav-link i { font-size: 1.4rem; }
        .logout-btn { margin-top: auto; color: #ef4444; }
        .logout-btn:hover { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
        
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .recent-section { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .section-header { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; font-size: 1.2rem; font-weight: 600; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .data-table th { color: #6b7280; font-weight: 500; font-size: 0.95rem; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-paid { background: #d1fae5; color: #059669; }
        
        .lux-input { width: 100%; padding: 12px 15px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Prompt'; margin-bottom: 15px; }
        .submit-btn { background: #111; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-family: 'Prompt'; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1rem; }
        .submit-btn:hover { background: #d4af37; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">MyDorm</div>
        <a href="dashboard.html" class="nav-link"><i class='bx bx-grid-alt'></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html" class="nav-link"><i class='bx bx-receipt'></i> รายการค้างชำระ</a>
        <a href="maintenance.html" class="nav-link active"><i class='bx bx-wrench'></i> แจ้งซ่อม/ปัญหา</a>
        <a href="profile.html" class="nav-link"><i class='bx bx-user'></i> ข้อมูลส่วนตัว</a>
        <a href="chat.html" class="nav-link"><i class='bx bx-message-square-dots'></i> ติดต่อนิติบุคคล</a>
        <a href="#" class="nav-link logout-btn" onclick="logout()"><i class='bx bx-log-out'></i> ออกจากระบบ</a>
    </div>

    <div class="main-content">
        <!-- ฝั่งซ้าย ประวัติ -->
        <div>
            <h1 style="font-size: 1.8rem; margin: 0 0 30px 0; color: #111;">แจ้งซ่อมและปัญหาต่างๆ</h1>
            <div class="recent-section">
                <div class="section-header">ประวัติการแจ้งซ่อม</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>เรื่อง</th>
                            <th>วันที่แจ้ง</th>
                            <th>สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="maintenance-list">
                        <tr>
                            <td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ฝั่งขวา ฟอร์ม -->
        <div>
            <h1 style="font-size: 1.8rem; margin: 0 0 30px 0; color: transparent;">-</h1>
            <div class="recent-section">
                <div class="section-header">แบบฟอร์มแจ้งซ่อมใหม่</div>
                <form id="maintenanceForm">
                    <input type="text" id="m_title" class="lux-input" placeholder="เรื่องที่ต้องการแจ้ง (เช่น ก๊อกน้ำรั่ว)" required>
                    <textarea id="m_desc" class="lux-input" placeholder="รายละเอียดเพิ่มเติม" rows="4" required></textarea>
                    <button type="submit" class="submit-btn" id="submitBtn">ส่งเรื่องแจ้งซ่อม <i class='bx bx-send'></i></button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let userEmail = "";

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login.html"; return; }
            userEmail = session.user.email;
            
            fetchMaintenance();
        });

        async function fetchMaintenance() {
            const { data: requests, error } = await supabaseClient
                .from('maintenance_requests')
                .select('*')
                .eq('email', userEmail)
                .order('created_at', { ascending: false });
                
            const list = document.getElementById("maintenance-list");
            list.innerHTML = "";
            
            if (error || !requests || requests.length === 0) {
                list.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#6b7280;">ยังไม่มีประวัติการแจ้งซ่อม</td></tr>`;
                return;
            }
            
            requests.forEach(req => {
                let statusHtml = "";
                if (req.status === "completed") {
                    statusHtml = `<span class="status-badge status-paid">เสร็จสิ้น</span>`;
                } else if (req.status === "in_progress") {
                    statusHtml = `<span class="status-badge status-pending" style="background:#e0e7ff; color:#4f46e5;">กำลังซ่อม</span>`;
                } else {
                    statusHtml = `<span class="status-badge status-pending">รอดำเนินการ</span>`;
                }
                
                // Format Date
                let d = new Date(req.created_at);
                let dateStr = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });

                list.innerHTML += `
                    <tr>
                        <td><strong>${req.title}</strong><br><small style="color:#6b7280">${req.description || '-'}</small></td>
                        <td>${dateStr}</td>
                        <td>${statusHtml}</td>
                    </tr>
                `;
            });
        }

        document.getElementById("maintenanceForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerHTML = "กำลังส่ง...";
            btn.disabled = true;

            const title = document.getElementById("m_title").value;
            const desc = document.getElementById("m_desc").value;
            
            const { error } = await supabaseClient
                .from('maintenance_requests')
                .insert([{ email: userEmail, title: title, description: desc }]);
                
            if (error) {
                alert("เกิดข้อผิดพลาดในการแจ้งซ่อม: " + error.message);
            } else {
                alert("ส่งเรื่องแจ้งซ่อมเรียบร้อยแล้ว แอดมินจะรีบตรวจสอบให้ครับ!");
                this.reset();
                fetchMaintenance(); // โหลดข้อมูลใหม่
            }
            
            btn.innerHTML = "ส่งเรื่องแจ้งซ่อม <i class='bx bx-send'></i>";
            btn.disabled = false;
        });
    </script>
</body>
</html>
