<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - MyDorm</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body { background-color: #f3f4f6; margin: 0; font-family: 'Prompt', sans-serif; display: flex; }
        .sidebar { width: 260px; background: #fff; height: 100vh; padding: 20px 0; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; display: flex; flex-direction: column; }
        .sidebar-logo { text-align: center; font-size: 1.8rem; font-weight: 600; color: #d4af37; margin-bottom: 30px; letter-spacing: 1px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 15px 25px; color: #4b5563; text-decoration: none; font-size: 1rem; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #f9fafb; color: #d4af37; border-right: 4px solid #d4af37; }
        .nav-link i { font-size: 1.4rem; }
        .logout-btn { margin-top: auto; color: #ef4444; }
        .logout-btn:hover { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
        
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .recent-section { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); max-width: 600px; }
        .section-header { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px; font-size: 1.2rem; font-weight: 600; }
        
        .info-group { margin-bottom: 20px; }
        .info-group label { color: #6b7280; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        .info-group .info-val { font-size: 1.1rem; color: #111; font-weight: 500; background: #f9fafb; padding: 12px 15px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">MyDorm</div>
        <a href="dashboard.html" class="nav-link"><i class='bx bx-grid-alt'></i> ภาพรวม (Dashboard)</a>
        <a href="billing.html" class="nav-link"><i class='bx bx-receipt'></i> รายการค้างชำระ</a>
        <a href="maintenance.html" class="nav-link"><i class='bx bx-wrench'></i> แจ้งซ่อม/ปัญหา</a>
        <a href="profile.html" class="nav-link active"><i class='bx bx-user'></i> ข้อมูลส่วนตัว</a>
        <a href="#" class="nav-link logout-btn" onclick="logout()"><i class='bx bx-log-out'></i> ออกจากระบบ</a>
    </div>

    <div class="main-content">
        <h1 style="font-size: 1.8rem; margin: 0 0 30px 0; color: #111;">การตั้งค่าบัญชี</h1>
        
        <div class="recent-section">
            <div class="section-header">ข้อมูลส่วนตัวของคุณ</div>
            
            <div class="info-group">
                <label>ชื่อ-นามสกุล</label>
                <div class="info-val" id="p_name">กำลังโหลด...</div>
            </div>
            <div class="info-group">
                <label>อีเมล (ที่ใช้เข้าสู่ระบบ)</label>
                <div class="info-val" id="p_email">กำลังโหลด...</div>
            </div>
            <div class="info-group">
                <label>เบอร์โทรศัพท์</label>
                <div class="info-val" id="p_phone">กำลังโหลด...</div>
            </div>
            
            <button class="nav-link" style="background:#111; color:#fff; border-radius:8px; justify-content:center; margin-top:30px; width:100%; border:none; padding:12px;" onclick="alert('ฟังก์ชันแก้ไขข้อมูลส่วนตัวยังไม่เปิดใช้งาน')">
                <i class='bx bx-edit-alt'></i> ขอแก้ไขข้อมูล
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const user = session.user;
                document.getElementById("p_email").innerText = user.email;
                if (user.user_metadata) {
                    document.getElementById("p_name").innerText = (user.user_metadata.title || "") + (user.user_metadata.full_name || "ไม่ระบุ");
                    document.getElementById("p_phone").innerText = user.user_metadata.phone || "ไม่ระบุเบอร์โทรศัพท์";
                }
            }
        });
    </script>
</body>
</html>
