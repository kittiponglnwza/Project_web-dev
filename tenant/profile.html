<!DOCTYPE html><html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้เช่า - Dorminator</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2.1">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=1.2.0" rel="stylesheet">
    <link rel="stylesheet" href="../css/tenant/profile.css?v=1.2.0">
</head>
<body class="tenant-layout">

    <nav class="sidebar" id="app-sidebar"></nav>

    <main class="main-content">
        <h1 class="page-title">แฟ้มประวัติผู้เช่า (Tenant Profile)</h1>
        
        <div class="recent-section">
            
            <div class="sub-header"><i class="bx bx-user-pin"></i> ข้อมูลส่วนบุคคล (Personal Info)</div>
            <div class="profile-grid">
                <div class="info-group">
                    <label>ชื่อ-นามสกุล (Full Name)</label>
                    <div class="info-val" id="p_name">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>เลขประจำตัวประชาชน (National ID)</label>
                    <div class="info-val" id="p_nid">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>อีเมล (Email Address)</label>
                    <div class="info-val" id="p_email">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>เบอร์โทรศัพท์ (Phone Number)</label>
                    <div class="info-val" id="p_phone">กำลังโหลด...</div>
                </div>
                <div class="info-group" style="grid-column: 1 / -1;">
                    <label>ที่อยู่ตามทะเบียนบ้าน (Address)</label>
                    <div class="info-val" id="p_address">กำลังโหลด...</div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="sub-header"><i class="bx bx-file"></i> ข้อมูลสัญญาเช่า (Lease Agreement)</div>
            <div class="profile-grid">
                <div class="info-group">
                    <label>หมายเลขห้อง (Room Number)</label>
                    <div class="info-val" id="p_room">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>สถานะสัญญา (Status)</label>
                    <div class="info-val" id="p_status" style="font-weight: 600;">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>วันเริ่มต้นสัญญา (Start Date)</label>
                    <div class="info-val" id="p_start">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>วันสิ้นสุดสัญญา (End Date)</label>
                    <div class="info-val" id="p_end">กำลังโหลด...</div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="sub-header"><i class="bx bx-phone-call"></i> ผู้ติดต่อฉุกเฉิน (Emergency Contact)</div>
            <div class="profile-grid">
                <div class="info-group">
                    <label>ชื่อผู้ติดต่อ (Contact Name)</label>
                    <div class="info-val" id="p_em_name">กำลังโหลด...</div>
                </div>
                <div class="info-group">
                    <label>เบอร์โทรศัพท์ฉุกเฉิน (Emergency Phone)</label>
                    <div class="info-val" id="p_em_phone">กำลังโหลด...</div>
                </div>
            </div>


        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js?v=2"></script>
    <script src="../js/shared/utils.js"></script>
    <script src="../js/shared/auth-guard.js"></script>
    <script src="../js/shared/components.js"></script>
    <script src="../js/tenant/profile.js"></script>
</body></html>
